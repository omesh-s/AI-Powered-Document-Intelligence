# Local dependencies for Document Intelligence (Postgres+pgvector, Redis, MinIO).
# Start API/Web from the host: see Makefile (make api / make web).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: docintel
      POSTGRES_PASSWORD: docintel
      POSTGRES_DB: docintel
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docintel -d docintel"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    # MinIO images are minimal (no curl). Typical stack order: postgres + redis + minio
    # (wait for 9000 from host) → migrations → API → ingestion worker → web dev server.

volumes:
  postgres_data:
  minio_data:
