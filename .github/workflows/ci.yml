name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: docintel
          POSTGRES_PASSWORD: docintel
          POSTGRES_DB: docintel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docintel -d docintel"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 4s
          --health-timeout 3s
          --health-retries 10
    env:
      API_SECRET_KEY: ci-test-secret-key-32chars-minimum-required
      DATABASE_URL: postgresql+asyncpg://docintel:docintel@127.0.0.1:5432/docintel
      DATABASE_SYNC_URL: postgresql+psycopg://docintel:docintel@127.0.0.1:5432/docintel
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/1
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
      EMBEDDING_PROVIDER: fake
      LLM_PROVIDER: fake
      RATE_LIMIT_REGISTER_PER_MINUTE: "200"
      RATE_LIMIT_LOGIN_PER_MINUTE: "200"
      RATE_LIMIT_REFRESH_PER_MINUTE: "200"
      RATE_LIMIT_UPLOAD_URL_PER_MINUTE: "200"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API + dev tools
        run: |
          python -m pip install -U pip
          python -m pip install -e "./apps/api[dev]"
      - name: Ruff
        run: |
          python -m ruff check apps/api
          python -m ruff format --check apps/api
      - name: Migrations
        run: python -m alembic upgrade head
        working-directory: apps/api
      - name: Pytest
        run: python -m pytest tests -q
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
        working-directory: apps/web
      - name: Lint
        run: npm run lint
        working-directory: apps/web
      - name: Test
        run: npm test
        working-directory: apps/web
      - name: Build
        run: npm run build
        working-directory: apps/web
